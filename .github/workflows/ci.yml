name: Lean CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and kernel checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Build with captured diagnostics
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          lake update > build.log 2>&1
          setup_status=$?
          if [ "$setup_status" -eq 0 ]; then
            lake exe cache get >> build.log 2>&1
            setup_status=$?
          fi
          if [ "$setup_status" -eq 0 ]; then
            lake build --wfail >> build.log 2>&1
            setup_status=$?
          fi
          tail -n 250 build.log
          echo "exit_code=${setup_status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: build.log
      - name: Enforce successful build
        shell: bash
        run: test "${{ steps.build.outputs.exit_code }}" = "0"
      - name: Reject proof placeholders
        shell: bash
        run: |
          if git grep -nE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' -- '*.lean'; then
            echo 'Proof placeholder or user axiom found.'
            exit 1
          fi
      - name: Independent kernel checks
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false

  release:
    name: Tag and GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" -m "Thermal Valve Passport ${TAG}"
            git push origin "${TAG}"
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "Thermal Valve Passport ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
